name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [validate-vendor, lint, test]
    steps:
    - uses: actions/checkout@v7
    - name: build container image
      run: docker build -f Containerfile -t skillctldev .
    - name: ${{ matrix.target }}
      run: docker run --rm -v $PWD:/src/skillctl skillctldev make ${{ matrix.target }}
