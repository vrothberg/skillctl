name: "skillctl"
description: >
  Pull and extract OCI-based AI agent skills tracked by skillctl, and
  commit the updated files. Wraps the documented go install path, so no
  extra system libraries are required. Requires the jobs permission
  `contents: write` when commit-and-push is enabled.

inputs:
  commit-and-push:
    description: >
      Commit and push the extracted skill files and the manifest. Set to
      "false" to only run skillctl.
    default: "true"
  commit-message:
    description: Commit message used when skill files changed.
    default: "Update extracted skill files"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: "stable"
        # The cache keys on the calling repository's dependency file
        # (e.g. go.mod), which is unrelated to skillctl's module graph,
        # and produces a warning annotation in repositories without one.
        cache: false

    - name: Install skillctl
      shell: bash
      run: |
        go install -tags "exclude_graphdriver_btrfs containers_image_openpgp" \
            github.com/vrothberg/skillctl/cmd/skillctl@latest
        skillctl version

    - name: Run skillctl
      shell: bash
      run: skillctl update --force

    - name: Commit and push updated skills
      if: ${{ inputs.commit-and-push == 'true' }}
      shell: bash
      env:
        SKILLCTL_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        SKILLCTL_ACTION_PATH: ${{ github.action_path }}
      run: bash "$SKILLCTL_ACTION_PATH/hack/action/commit.sh"
