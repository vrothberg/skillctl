name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'
    - name: install dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install bats libbtrfs-dev libgpgme-dev libdevmapper-dev
    - name: build
      run: make build
    - name: unit tests
      run: make test-unit
    - name: integration tests
      run: make test-integration
