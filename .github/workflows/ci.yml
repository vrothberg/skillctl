name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [validate-vendor, lint, test]
    steps:
    - uses: actions/checkout@v7
    - name: ${{ matrix.target }}
      run: make container-${{ matrix.target }}
